# Pin the Compose project name so moving this file into infrastructure/docker/
# does not change resource names. Without it the project would be named
# "docker" and Compose would create a new, empty "docker_postgres_data" volume
# instead of reusing the existing "rag-project_postgres_data" volume.
name: rag-project

# Paths below are resolved relative to this file (infrastructure/docker/).
# Variable interpolation (${...}) reads server/.env only when Compose is run with
# --env-file ../../server/.env, which scripts/compose.sh does for you.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../../server
    container_name: contextiq-api
    restart: unless-stopped
    env_file:
      - ../../server/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpassword}@postgres:5432/${POSTGRES_DB:-ragdb}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../../server/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  postgres_data:
